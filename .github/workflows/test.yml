name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pc-server-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pc_server/package-lock.json
      - run: npm ci --prefix pc_server
      - run: npm test --prefix pc_server
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Android tracking core regression tests
        shell: pwsh
        run: ./apps/android/test-core.ps1
